<div class="gdt-form-field">
<label for="<%=input.get_name()%>"><%=field.render_label()%></label>
</div>
<textarea id="<%=input.get_name()%>" name="<%=input.get_name()%>"
aria-label="<%=field.render_label(Mode.render_html)%>"
<%=input.input_required()%>
<%=input.input_readonly()%>><%=input.html_value()%></textarea>
<% if field.has_error():
    write(f'<div class="form-field-error">%s</div>' % field.render_error())
%>
